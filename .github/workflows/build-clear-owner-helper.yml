name: Build clear-owner helper

on:
  push:
    branches:
      - clear-appmanager-device-owner-20260912
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify helper contract
        run: python clear-owner/tests/test_helper_contract.py

      - name: Build instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p clear-owner/build/classes clear-owner/build/dex

          javac -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -d clear-owner/build/classes \
            clear-owner/src/dev/openai/clearowner/ClearOwnerInstrumentation.java

          jar cf clear-owner/build/helper-classes.jar -C clear-owner/build/classes .
          "$BT/d8" \
            --lib "$ANDROID_JAR" \
            --min-api 21 \
            --output clear-owner/build/dex \
            clear-owner/build/helper-classes.jar

          "$BT/aapt2" link \
            --manifest clear-owner/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -o clear-owner/build/unsigned.apk

          (cd clear-owner/build/dex && zip -q -u ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 \
            clear-owner/build/unsigned.apk \
            clear-owner/build/aligned.apk

      - name: Fetch App Manager public debug signing key
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/MuntashirAkon/AppManager/master/app/dev_keystore.jks \
            -o clear-owner/build/dev_keystore.jks
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/MuntashirAkon/AppManager/master/app/build.gradle \
            -o clear-owner/build/upstream-build.gradle

      - name: Sign and verify exact certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          GRADLE=clear-owner/build/upstream-build.gradle
          STORE_PASS=$(sed -n "s/.*storePassword '\([^']*\)'.*/\1/p" "$GRADLE" | head -1)
          KEY_PASS=$(sed -n "s/.*keyPassword '\([^']*\)'.*/\1/p" "$GRADLE" | head -1)
          KEY_ALIAS=$(sed -n "s/.*keyAlias '\([^']*\)'.*/\1/p" "$GRADLE" | head -1)
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          test -n "$KEY_ALIAS"

          "$BT/apksigner" sign \
            --ks clear-owner/build/dev_keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out clear-owner/build/Clear-AppManager-DeviceOwner.apk \
            clear-owner/build/aligned.apk

          "$BT/apksigner" verify --verbose --print-certs \
            clear-owner/build/Clear-AppManager-DeviceOwner.apk

          EXPECTED=9B11AF48E91EC12CEB9EB51FB0ACBB69BCE0FA77E13FCEBFF855C32AF5EF7C4B
          ACTUAL=$("$BT/apksigner" verify --print-certs \
            clear-owner/build/Clear-AppManager-DeviceOwner.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1 | tr '[:lower:]' '[:upper:]')
          echo "Helper certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload helper APK
        uses: actions/upload-artifact@v4
        with:
          name: Clear-AppManager-DeviceOwner
          path: clear-owner/build/Clear-AppManager-DeviceOwner.apk
          if-no-files-found: error
